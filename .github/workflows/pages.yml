name: Deploy GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Install dependencies
        run: bundle install --path vendor/bundle
      - name: Build site
        run: bundle exec jekyll build -d _site
      # The CV PDF is generated, never committed: print /cv/print/ (built from
      # _papers/ and _data/cv.yml) so it can't drift from the site. Liberation
      # Sans is the metric-compatible stand-in for Arial on Linux.
      - name: Print CV to PDF
        run: |
          sudo apt-get install -y --no-install-recommends fonts-liberation
          ./scripts/print-cv.sh
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
