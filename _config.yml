title: Dominic Smith
name: Dominic Smith
description: "Research Economist at the U.S. Bureau of Labor Statistics and Adjunct Professor at Case Western Reserve University."
url: "https://dominic-smith.com"
baseurl: "" # e.g. /site if needed

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

permalink: pretty

# Papers are the single source of truth for every publication listing on the
# site: the home page research section, /publications/, the per-paper landing
# pages (which carry the Google Scholar citation_ meta tags), and references.bib.
collections:
  papers:
    output: true
    permalink: /papers/:name/

defaults:
  - scope:
      path: ""
      type: papers
    values:
      layout: paper

# Navigation structure (used by nav include)
nav:
  - title: Home
    url: /
  - title: Research
    url: /#research
  - title: Teaching
    url: /teaching/
  - title: CV
    url: /assets/cv/dominic_smith_cv.pdf

# Author info
author:
  name: Dominic Smith
  email: ds@dominic-smith.com

seo:
  twitter_card: summary
  type: website

# Section headings for the research listings, in display order. The `key` must
# match the `section` field in each _papers entry.
paper_sections:
  - key: working
    title: Work in Progress
  - key: publications
    title: Publications
  - key: in-progress
    title: In-Progress Research
  - key: resting
    title: Resting Papers
